name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 编译检查
        run: |
          python -m py_compile main.py chat.py stats.py agent/*.py tools/*.py tests/*.py eval/*.py deploy/*.py
      - name: 离线回归（解析器/记忆层/FC协议/schema导出，无需LLM/网络）
        run: |
          python tests/test_parser.py
          python tests/test_memory.py
          python tests/test_fc.py
